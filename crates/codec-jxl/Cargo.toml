[package]
name = "rs-immicher-oxide-codec-jxl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "JPEG XL image transcoder for rs-immicher-oxide media pipelines."
documentation = "https://docs.rs/rs-immicher-oxide-codec-jxl"
readme = "README.md"
keywords = ["immich", "jxl", "jpeg-xl", "transcode"]
categories = ["multimedia::images"]
include = ["Cargo.toml", "README.md", "src/**"]

[dependencies]
rs-immicher-oxide-core = { version = "0.1.0", path = "../core" }
media-oxide = { version = "0.1.0", path = "../media-oxide" }
async-trait = "0.1"
tempfile = "3"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
